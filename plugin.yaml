name: seo-keywords
version: 1.0.0
description: SEO keyword management — insert seed keywords into MariaDB by market
author: your-name

provides_tools:
  - insert_seed_keywords
  - get_existing_seed_keywords_by_market
  - analyze_keyword_opportunities

requires_env:
  - name: DB_HOST
    description: "MariaDB host (e.g. 192.168.1.10 or db.example.com)"
    url: ""
    secret: false
  - name: DB_PORT
    description: "MariaDB port (default: 3306)"
    url: ""
    secret: false
  - name: DB_AMZ
    description: "Database name"
    url: ""
    secret: false
  - name: DB_USER
    description: "Database user"
    url: ""
    secret: false
  - name: DB_PASSWORD
    description: "Database password"
    url: ""
    secret: true
